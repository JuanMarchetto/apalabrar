# cargo-deny configuration
# See https://embarkstudios.github.io/cargo-deny/

[advisories]
version = 2
ignore = [
    # yaml-rust is unmaintained but has no safe upgrade path. Pulled in
    # transitively via comrak -> syntect. Re-evaluate when syntect drops it
    # or when we replace comrak.
    "RUSTSEC-2024-0320",
]

[licenses]
version = 2
confidence-threshold = 0.8
# Permissive licenses commonly seen in the Rust ecosystem. Apalabrar's own
# code is MIT (see Cargo.toml). Transitive deps under any of these are
# acceptable; AGPL/GPL/LGPL remain forbidden by omission.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "0BSD",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
    "Zlib",
    "MPL-2.0",
]

[bans]
# The workspace pulls in duplicate transitive versions via Loro and others;
# warn but don't block. Enforce strict deduplication once 1.0 lands.
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
