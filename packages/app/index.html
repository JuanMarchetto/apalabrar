<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Apalabrar — editor de documentos académicos en el navegador. Local-first, MIT, sin login." />
    <title>Apalabrar</title>
    <style>
      /* Phase 2.5 — critical CSS inlined for T+0 paint of the
         page-load skeleton. Mirrors the Tailwind classes used by
         <Landing> so the shell looks identical before and after
         hydration. */
      html, body { margin: 0; padding: 0; background: #fafafa; color: #171717; font-family: ui-sans-serif, system-ui, sans-serif; }
      #skeleton { min-height: 100vh; }
      #skeleton header { display: flex; align-items: center; justify-content: space-between; padding: 0.75rem 1.5rem; background: #fff; border-bottom: 1px solid #e5e5e5; }
      #skeleton h1 { font-size: 1.125rem; font-weight: 600; letter-spacing: -0.01em; margin: 0; }
      #skeleton .frame { max-width: 48rem; margin: 0 auto; padding: 2rem; }
      #skeleton .surface { min-height: 60vh; background: #fff; border: 1px solid #e5e5e5; border-radius: 0.375rem; padding: 1.5rem; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
    </style>
  </head>
  <body>
    <div id="skeleton" data-testid="skeleton-shell">
      <header><h1>Apalabrar</h1></header>
      <div class="frame"><div class="surface" data-testid="blank-doc-skeleton"></div></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
