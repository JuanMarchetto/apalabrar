[package]
name = "apalabrar-layout"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Layout engine — paged layout, line breaking, text shaping (rustybuzz + cosmic-text)."

[dependencies]
apalabrar-doc-model.workspace = true
cosmic-text.workspace = true
rustybuzz.workspace = true
# Phase 5.7 — `RenderPlan` and friends derive `Serialize` so the wasm
# bridge can ship them across to the JS painter as a JSON payload.
# Deserialize is not needed (the JS side never re-feeds a plan back to
# Rust); keeping the dep narrow shrinks the wasm bundle.
serde = { workspace = true, features = ["derive"] }
thiserror.workspace = true

[dev-dependencies]
apalabrar-format-docx.workspace = true
insta.workspace = true
proptest.workspace = true
serde_json.workspace = true

# `render_plan_p95` is the Phase 4.1 acceptance bench: 200-page doc,
# `layout(doc, vp)` p95 over 1 000 calls, gate 50 ms. Non-Criterion
# binary; prints p50/p95/p99 and exits non-zero if p95 > budget.
[[bench]]
name = "render_plan_p95"
harness = false
required-features = []
