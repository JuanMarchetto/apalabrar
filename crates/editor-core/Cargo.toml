[package]
name = "apalabrar-editor-core"
version.workspace = true
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Apalabrar editor core — umbrella public API."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
apalabrar-ai-bridge.workspace = true
apalabrar-citation.workspace = true
apalabrar-doc-model.workspace = true
apalabrar-format-docx.workspace = true
apalabrar-format-html.workspace = true
apalabrar-format-md.workspace = true
apalabrar-layout.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
wasm-bindgen.workspace = true

# The plugin host depends on wasmtime+cranelift, which cannot itself
# compile to wasm32. Apalabrar plugins run in the desktop/server tier
# (a Tauri shell or the sync server), never inside the browser bundle.
# Kept out of the wasm32 target so `wasm-pack build` succeeds for
# editor-core; native tests still pull it in via the native target.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
apalabrar-plugin-host.workspace = true

[dev-dependencies]
docx-rs.workspace = true
insta.workspace = true
proptest.workspace = true
wasm-bindgen-test.workspace = true
