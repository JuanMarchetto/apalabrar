[workspace]
resolver = "3"
members = [
    "crates/ai-bridge",
    "crates/citation",
    "crates/doc-model",
    "crates/editor-core",
    "crates/format-docx",
    "crates/format-html",
    "crates/format-md",
    "crates/format-odt",
    "crates/format-rtf",
    "crates/layout",
    "crates/plugin-host",
    "examples/plugin-full-fixture",
    "examples/plugin-word-counter",
    "examples/plugin-zotero",
]

[workspace.package]
version = "0.0.0"
authors = ["Juan Patricio Marchetto <juanpatriciomarchetto@gmail.com>"]
categories = ["text-editors", "wasm"]
edition = "2024"
homepage = "https://apalabr.ar"
keywords = ["editor", "wasm", "crdt", "academic", "docx"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/apalabrar/apalabrar"
rust-version = "1.85"

[workspace.dependencies]
# Internal crates
apalabrar-ai-bridge = { path = "crates/ai-bridge", version = "0.0.0" }
apalabrar-citation = { path = "crates/citation", version = "0.0.0" }
apalabrar-doc-model = { path = "crates/doc-model", version = "0.0.0" }
apalabrar-format-docx = { path = "crates/format-docx", version = "0.0.0" }
apalabrar-format-html = { path = "crates/format-html", version = "0.0.0" }
apalabrar-format-md = { path = "crates/format-md", version = "0.0.0" }
apalabrar-format-odt = { path = "crates/format-odt", version = "0.0.0" }
apalabrar-format-rtf = { path = "crates/format-rtf", version = "0.0.0" }
apalabrar-layout = { path = "crates/layout", version = "0.0.0" }
apalabrar-plugin-host = { path = "crates/plugin-host", version = "0.0.0" }

# Core
cosmic-text = "0.12"
jumprope = "1.1"
loro = "1.0"
rustybuzz = "0.20"

# Format
comrak = "0.53"
docx-rs = "0.4"
html5ever = "0.29"
markup5ever_rcdom = "0.5.0-unofficial"
pulldown-cmark = "0.12"
quick-xml = "0.36"
# Default features pull in `zstd-sys`, which needs a system clang to build for
# wasm32. DOCX uses Deflate, not Zstd, so we strip the unused features. Keep
# this in lock-step with `docx-rs`'s own zip dep declaration so feature
# unification doesn't quietly re-enable zstd.
zip = { version = "0.6", default-features = false, features = ["deflate"] }

# Citation — citeproc-rs is not yet published to crates.io; the citation crate
# will pull it in via git source when the engine is implemented (Prompt 2.x).

# Errors
anyhow = "1.0"
thiserror = "1.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async
tokio = { version = "1.40", features = ["rt", "macros"] }

# Dev / test
criterion = { version = "0.5", features = ["html_reports"] }
insta = { version = "1.40", features = ["yaml", "json"] }
proptest = "1.5"

# WASM
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-test = "0.3"
web-sys = "0.3"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.release.package."*"]
opt-level = "s"

[profile.bench]
debug = true

[profile.dev]
opt-level = 0
debug = true
